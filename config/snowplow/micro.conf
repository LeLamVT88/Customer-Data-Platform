collector {
  interface = "0.0.0.0"
  port = "9090"

  ssl {
    enable = false
    redirect = false
    port = 9543
  }

  p3p {
    policyRef = "/w3c/p3p.xml"
    CP = "NOI DSP COR NID PSA OUR IND COM NAV STA"
  }

  crossDomain {
    enabled = false
    domains = [ "*" ]
    secure = true
  }

  # Collector gắn cookie để định danh người dùng. Domain suy ra từ header
  # Origin; web demo chạy ở localhost nên cần cả http.
  cookie {
    enabled = true
    expiration = "365 days"
    name = "cdp_snowplow"
    domains = [ "localhost", "127.0.0.1" ]
    fallback-domain = "localhost"
    secure = false
    httpOnly = false
    sameSite = "Lax"
  }

  doNotTrackCookie {
    enabled = false
    name = ""
    value = ""
  }

  cookieBounce {
    enabled = false
    name = "n3pc"
    fallbackNetworkUserId = "00000000-0000-4000-A000-000000000000"
  }

  redirectMacro {
    enabled = false
    placeholder = "[TOKEN]"
  }

  rootResponse {
    enabled = false
    statusCode = 302
    headers = {
      Location = ""
      X-Custom = ""
    }
    body = "302, redirecting"
  }

  cors {
    accessControlMaxAge = 5 seconds
  }

  prometheusMetrics {
    enabled = false
  }

  streams {
    good = ""
    bad = ""

    useIpAddressAsPartitionKey = false

    # Micro chạy ở chế độ in-memory; không đẩy vào Kinesis/Kafka.
    sink {
      enabled = stdout
    }

    buffer {
      byteLimit = 100000
      recordLimit = 40
      timeLimit = 1000
    }
  }
}

akka {
  loglevel = INFO
  loggers = ["akka.event.slf4j.Slf4jLogger"]

  http.server {
    remote-address-header = on
    raw-request-uri-header = on

    parsing {
      max-uri-length = 32768
      uri-parsing-mode = relaxed
    }
  }
}
