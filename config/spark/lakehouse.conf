# Spark configuration for the shared Iceberg lakehouse (local, non-Docker).
#
# Load with: spark-submit --properties-file config/spark/lakehouse.conf
# Or from PySpark: SparkSession.builder.config("spark.sql.catalog.cdp", ...)

# ── Iceberg extensions ───────────────────────────────────────────────────────
# Enables MERGE INTO, CALL rewrite_data_files, add_files and the rest of the
# Iceberg Spark procedure surface. Without this line the catalog works for
# plain SELECT/INSERT but fails on every write-optimisation command.
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ── Catalog ──────────────────────────────────────────────────────────────────
# The catalog holds only metadata (schema, partitions, snapshots, manifests).
# The data itself lives in object storage.
spark.sql.catalog.cdp org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.cdp.catalog-impl org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.cdp.uri jdbc:postgresql://127.0.0.1:15434/iceberg
spark.sql.catalog.cdp.jdbc.user cdp
spark.sql.catalog.cdp.jdbc.password cdp-local-catalog
spark.sql.catalog.cdp.warehouse s3://cdp/warehouse

# ── Object storage ───────────────────────────────────────────────────────────
# S3FileIO is the AWS-compatible file IO. Without it Iceberg falls back to
# HadoopFileIO and the s3:// scheme is not understood.
spark.sql.catalog.cdp.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.cdp.s3.endpoint http://127.0.0.1:9000
spark.sql.catalog.cdp.s3.path-style-access true
spark.sql.catalog.cdp.s3.chunked-encoding-enabled false
spark.sql.catalog.cdp.s3.access-key-id cdp-local
spark.sql.catalog.cdp.s3.secret-access-key cdp-local-storage
spark.sql.catalog.cdp.s3.region us-east-1

# ── Behaviour ────────────────────────────────────────────────────────────────
# UTC everywhere: REES46 timestamps are naive local time, Snowplow is UTC.
# Mixing them without a fixed session timezone shifts partition boundaries.
spark.sql.session.timeZone UTC
spark.sql.ansi.enabled true
spark.sql.shuffle.partitions 16
spark.sql.adaptive.enabled true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.ui.enabled false
spark.serializer org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.advisoryPartitionSizeInBytes 67108864
spark.local.dir data/spark-temp
spark.driver.maxResultSize 1g
