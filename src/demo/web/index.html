<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDP Demo Store</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <nav class="nav">
    <a href="#home" class="nav-brand">🛒 CDP Demo Store</a>
    <div class="nav-links">
      <a href="#home" class="nav-link" data-page="home">Trang chủ</a>
      <a href="#catalog" class="nav-link" data-page="catalog">Danh mục</a>
      <a href="#cart" class="nav-link" data-page="cart">
        Giỏ hàng <span id="cart-badge" style="display:none"></span>
      </a>
      <a href="#dashboard" class="nav-link" data-page="dashboard">Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <!-- HOME -->
    <div id="page-home" class="page active">
      <div id="home-content"></div>
    </div>

    <!-- CATALOG -->
    <div id="page-catalog" class="page">
      <div id="catalog-content"></div>
    </div>

    <!-- PRODUCT DETAIL -->
    <div id="page-product" class="page">
      <div id="product-detail"></div>
    </div>

    <!-- CART -->
    <div id="page-cart" class="page">
      <div id="cart-content"></div>
    </div>

    <!-- CHECKOUT -->
    <div id="page-checkout" class="page">
      <div id="checkout-content"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page">
      <div id="dashboard-content"></div>
    </div>
  </div>

  <div id="status-bar"></div>

  <script type="module">
    import {
      onRoute, loadCatalog, loadCart, updateNavCartBadge,
      renderHomePage, renderCatalogPage, renderProductPage, renderCartPage,
      renderCheckoutPage, showStatus, flushEvents,
    } from './js/catalog.js';
    import { renderDashboard, startAutoRefresh, stopAutoRefresh } from './js/dashboard.js';

    // Initialise
    loadCatalog().catch(err => {
      console.error('Catalog load failed:', err);
      showStatus('Tải danh mục thất bại: ' + (err.message || err), true);
    });
    loadCart();
    updateNavCartBadge();

    function setActiveLink(hash) {
      document.querySelectorAll('.nav-link').forEach(a => {
        const page = a.dataset.page;
        a.classList.toggle('active', hash.startsWith('#' + page));
      });
    }

    async function router() {
      const hash = location.hash || '#home';
      setActiveLink(hash);

      if (!hash.startsWith('#dashboard')) stopAutoRefresh();

      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

      if (hash.startsWith('#catalog')) {
        document.getElementById('page-catalog').classList.add('active');
        await renderCatalogPage('catalog-content');
      } else if (hash.startsWith('#product')) {
        document.getElementById('page-product').classList.add('active');
        await renderProductPage('product-detail');
      } else if (hash.startsWith('#cart')) {
        document.getElementById('page-cart').classList.add('active');
        renderCartPage('cart-content');
      } else if (hash.startsWith('#checkout')) {
        document.getElementById('page-checkout').classList.add('active');
        renderCheckoutPage('checkout-content');
      } else if (hash.startsWith('#dashboard')) {
        document.getElementById('page-dashboard').classList.add('active');
        await renderDashboard();
        startAutoRefresh();
      } else {
        document.getElementById('page-home').classList.add('active');
        renderHomePage('home-content');
      }
    }

    onRoute(router);
  </script>
</body>
</html>
